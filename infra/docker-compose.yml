services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudhub}
      POSTGRES_USER: ${POSTGRES_USER:-cloudhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudhub}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cloudhub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudhub} -d ${POSTGRES_DB:-cloudhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cloudhub-postgres:
