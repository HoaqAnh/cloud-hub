spring.application.name=CloudHub

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/cloudhub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cloudhub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cloudhub}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

cloudhub.admin.username=${CLOUDHUB_ADMIN_USERNAME:admin}
cloudhub.admin.password=${CLOUDHUB_ADMIN_PASSWORD:admin}
cloudhub.token-key=${CLOUDHUB_TOKEN_KEY:}
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/oauth/google/callback}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
