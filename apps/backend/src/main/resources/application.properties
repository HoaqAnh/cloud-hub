spring.application.name=CloudHub

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/cloudhub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cloudhub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cloudhub}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
